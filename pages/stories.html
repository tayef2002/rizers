<div id="stories-page" class="app-page" style="display:none">
<div class="content">

  <!-- Stats -->
  <div class="stats-row" style="margin-top:4px">
    <div class="stat-card">
      <div class="stat-icon" style="background:linear-gradient(135deg,rgba(255,138,0,.15),rgba(255,184,0,.1))">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#FF8A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </div>
      <div class="stat-value" id="st-total-stat">50</div>
      <div class="stat-label">মোট গল্প</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:linear-gradient(135deg,rgba(34,197,94,.15),rgba(16,185,129,.1))">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="stat-value" id="st-read-stat">0</div>
      <div class="stat-label">পড়া হয়েছে</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:linear-gradient(135deg,rgba(139,92,246,.15),rgba(124,58,237,.1))">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      </div>
      <div class="stat-value" id="st-bk-stat">0</div>
      <div class="stat-label">Saved</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:linear-gradient(135deg,rgba(239,68,68,.15),rgba(220,38,38,.1))">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A6.5 6.5 0 0 0 12 21a6.5 6.5 0 0 0 6.5-6.5c0-3.5-2.5-6-3.5-8.5-1 2.5-3.5 5-3.5 8.5z"/></svg>
      </div>
      <div class="stat-value" id="st-streak-stat">7</div>
      <div class="stat-label">Streak</div>
    </div>
  </div>

  <!-- Search -->
  <div style="position:relative;margin-bottom:14px">
    <input id="st-search" oninput="stSearch()" type="text" placeholder="গল্প খুঁজুন..."
      style="width:100%;border:1.5px solid var(--border,#e5e7eb);border-radius:12px;padding:11px 42px 11px 14px;font-size:13px;font-family:inherit;outline:none;background:var(--card,#fff);color:var(--text,#1f2937);box-sizing:border-box"/>
    <span style="position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text2,#aaa)">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </span>
  </div>

  <!-- Category filter -->
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
    <button class="st-cat" onclick="stFilterCat('all',this)" style="padding:7px 16px;border-radius:50px;border:2px solid #FF8A00;background:linear-gradient(135deg,#FF8A00,#FFB800);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">সব</button>
    <button class="st-cat" onclick="stFilterCat('islamic',this)" style="padding:7px 16px;border-radius:50px;border:2px solid var(--border,#e5e7eb);background:var(--card,#fff);color:var(--text2,#666);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">Islamic</button>
    <button class="st-cat" onclick="stFilterCat('moral',this)" style="padding:7px 16px;border-radius:50px;border:2px solid var(--border,#e5e7eb);background:var(--card,#fff);color:var(--text2,#666);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">নৈতিক</button>
    <button class="st-cat" onclick="stFilterCat('adventure',this)" style="padding:7px 16px;border-radius:50px;border:2px solid var(--border,#e5e7eb);background:var(--card,#fff);color:var(--text2,#666);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">Adventure</button>
    <button class="st-cat" onclick="stFilterCat('sahabi',this)" style="padding:7px 16px;border-radius:50px;border:2px solid var(--border,#e5e7eb);background:var(--card,#fff);color:var(--text2,#666);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">সাহাবী</button>
    <button class="st-cat" onclick="stFilterCat('nature',this)" style="padding:7px 16px;border-radius:50px;border:2px solid var(--border,#e5e7eb);background:var(--card,#fff);color:var(--text2,#666);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">প্রকৃতি</button>
    <button class="st-cat" onclick="stFilterCat('bookmarked',this)" style="padding:7px 16px;border-radius:50px;border:2px solid var(--border,#e5e7eb);background:var(--card,#fff);color:var(--text2,#666);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">Saved</button>
  </div>

  <!-- Sort + count -->
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <span id="st-result-count" style="font-size:12px;color:var(--text2,#888);font-weight:600">50টি গল্প</span>
    <select onchange="stSort(this.value)" style="border:1.5px solid var(--border,#e5e7eb);border-radius:8px;padding:6px 10px;font-size:12px;font-family:inherit;outline:none;background:var(--card,#fff);color:var(--text,#1f2937)">
      <option value="new">নতুন প্রথম</option>
      <option value="popular">জনপ্রিয়</option>
      <option value="short">ছোট (দৈর্ঘ্য)</option>
      <option value="long">বড় (দৈর্ঘ্য)</option>
    </select>
  </div>

  <!-- Story list -->
  <div id="st-list" style="display:flex;flex-direction:column;gap:12px;margin-bottom:20px"></div>

  <!-- Story modal — full-page bottom sheet -->
  <div id="st-modal" style="display:none;position:fixed;inset:0;z-index:9999;pointer-events:none">
    <!-- dim overlay -->
    <div id="st-modal-bg" onclick="stCloseModal()"
         style="position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .32s ease;pointer-events:none"></div>
    <!-- sliding sheet -->
    <div id="st-modal-sheet"
         style="position:absolute;bottom:0;left:0;right:0;height:96vh;background:var(--card,#fff);border-radius:22px 22px 0 0;overflow:hidden;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .38s cubic-bezier(.32,.72,0,1);pointer-events:auto">
      <!-- header gradient -->
      <div id="st-modal-hdr" style="background:linear-gradient(135deg,#FF8A00,#FFB800);color:#fff;flex-shrink:0">
        <!-- drag handle -->
        <div style="display:flex;justify-content:center;padding:10px 0 0">
          <div style="width:38px;height:4px;background:rgba(255,255,255,.38);border-radius:2px"></div>
        </div>
        <!-- back + info row -->
        <div style="display:flex;align-items:flex-start;gap:12px;padding:10px 18px 20px">
          <button onclick="stCloseModal()"
                  style="background:rgba(255,255,255,.22);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div style="flex:1;min-width:0">
            <div id="st-modal-cat" style="font-size:11px;opacity:.82;font-weight:700;letter-spacing:.6px;margin-bottom:4px;text-transform:uppercase"></div>
            <div id="st-modal-title" style="font-size:20px;font-weight:800;line-height:1.25;margin-bottom:5px"></div>
            <div id="st-modal-meta" style="font-size:12px;opacity:.78"></div>
          </div>
        </div>
      </div>
      <!-- scrollable content -->
      <div style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 18px 32px">
        <div id="st-modal-body"
             style="font-size:14.5px;color:var(--text,#333);margin-bottom:20px;padding:18px;background:var(--bg,#fafafa);border-radius:14px;border:1px solid var(--border,#ebebeb)"></div>
        <!-- Quiz -->
        <div id="st-quiz-box" style="display:none;background:linear-gradient(135deg,rgba(255,138,0,.08),rgba(255,184,0,.05));border-radius:14px;padding:16px;margin-bottom:16px;border:1.5px solid rgba(255,138,0,.2)">
          <div style="font-size:13px;font-weight:700;color:#FF8A00;margin-bottom:10px">গল্প থেকে Quiz</div>
          <div id="st-quiz-q" style="font-size:13px;font-weight:600;color:var(--text,#1a1a2e);margin-bottom:10px"></div>
          <div id="st-quiz-opts" style="display:flex;flex-direction:column;gap:8px"></div>
          <div id="st-quiz-res" style="display:none;margin-top:10px;font-size:13px;font-weight:700;padding:11px 14px;border-radius:10px;text-align:center"></div>
        </div>
        <!-- Action buttons -->
        <div style="display:flex;gap:9px;flex-wrap:wrap">
          <button onclick="stMarkRead()" id="st-read-btn"
                  style="flex:1;padding:14px;background:linear-gradient(135deg,#FF8A00,#FFB800);color:#fff;border:none;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(255,138,0,.28)">পড়া শেষ</button>
          <button onclick="stToggleBookmark()" id="st-bk-btn"
                  style="padding:14px 18px;background:var(--bg,#f9fafb);color:#7c3aed;border:1.5px solid rgba(124,58,237,.3);border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          </button>
          <button onclick="stStartQuiz()"
                  style="flex:1;padding:14px;background:linear-gradient(135deg,#7c3aed,#8B5CF6);color:#fff;border:none;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(124,58,237,.28)">Quiz দাও</button>
        </div>
      </div>
    </div>
  </div>

</div>
</div>
