<div id="audio-page" class="app-page" style="display:none;overflow-x:hidden">
<style>
  #audio-page .ac-chip{padding:7px 14px;border-radius:50px;border:2px solid var(--border,#e5e7eb);background:var(--card,#fff);color:var(--text2,#666);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.18s}
  #audio-page .ac-chip.on{background:linear-gradient(135deg,#FF8A00,#FFB800);color:#090B12;border-color:#FF8A00}
  #audio-page .au-row{background:var(--card,#fff);border-radius:14px;padding:13px 14px;border:1.5px solid var(--border,#f0f0f0);display:flex;align-items:center;gap:12px;cursor:pointer;transition:.2s}
  #audio-page .au-row:active{opacity:.8;transform:scale(.99)}
  #audio-page .au-row.playing{border-color:rgba(255,138,0,.5);background:rgba(255,138,0,.04)}
</style>

<div style="padding:16px 16px 120px 16px">

  <!-- Header -->
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px">
    <div>
      <h1 style="font-size:20px;font-weight:700;color:var(--text,#1a1a2e);display:flex;align-items:center;gap:8px;margin:0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF8A00" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        Track
      </h1>
      <p style="color:var(--text2,#666);font-size:13px;margin-top:4px;margin-bottom:0">কুরআন, নাশিদ, দোয়া ও গল্প শোনো</p>
    </div>
    <div style="background:rgba(255,138,0,.1);border:1.5px solid rgba(255,138,0,.25);border-radius:14px;padding:10px 14px;text-align:center;min-width:60px">
      <div style="display:flex;align-items:center;justify-content:center;gap:3px">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#FF8A00"><path d="M12 2C8.5 7 6 10 6 14a6 6 0 0012 0c0-4-2.5-7-6-12z"/></svg>
        <span id="au-streak-num" style="font-size:18px;font-weight:700;color:#FF8A00">0</span>
      </div>
      <div style="font-size:10px;color:var(--text2,#666);font-weight:600">streak</div>
    </div>
  </div>

  <!-- Kid tabs -->
  <div id="audio-kid-tabs" style="display:none;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:none;-webkit-overflow-scrolling:touch;white-space:nowrap"></div>

  <!-- Now Playing Hero -->
  <div style="background:linear-gradient(160deg,#090B12 0%,#1c1f3a 50%,#12142a 100%);border-radius:22px;padding:22px;margin-bottom:14px;border:1px solid rgba(255,138,0,.2);box-shadow:0 8px 32px rgba(0,0,0,.4)">
    <!-- Track info -->
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:20px">
      <div id="au-cover" style="width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,#FF8A00,#FFB800);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 20px rgba(255,138,0,.4);font-size:28px">📖</div>
      <div style="flex:1;min-width:0">
        <div id="au-track-title" style="font-size:15px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">সূরা আল-ফাতিহা</div>
        <div id="au-track-artist" style="font-size:12px;color:rgba(255,255,255,.5);margin-top:2px">শেখ মিশারি</div>
        <div id="au-track-cat" style="display:inline-block;margin-top:5px;font-size:10px;font-weight:700;color:#FF8A00;background:rgba(255,138,0,.15);padding:2px 10px;border-radius:50px">কুরআন</div>
      </div>
      <button id="au-fav-btn" onclick="auToggleFav()" style="background:none;border:none;cursor:pointer;padding:8px;color:rgba(255,255,255,.3);transition:.2s">
        <svg id="au-fav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
      </button>
    </div>

    <!-- Progress bar -->
    <div style="margin-bottom:14px">
      <div id="au-prog-track" style="height:4px;background:rgba(255,255,255,.12);border-radius:4px;margin-bottom:8px;cursor:pointer;position:relative" onclick="auSeek(event,this)">
        <div id="au-prog-bar" style="height:100%;width:0%;background:linear-gradient(90deg,#FF8A00,#FFB800);border-radius:4px;transition:.3s;position:relative">
          <div style="position:absolute;right:-5px;top:-3px;width:10px;height:10px;border-radius:50%;background:#FFB800;box-shadow:0 0 6px rgba(255,184,0,.6)"></div>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between">
        <span id="au-time-cur" style="font-size:10px;color:rgba(255,255,255,.4);font-weight:600">0:00</span>
        <span id="au-time-tot" style="font-size:10px;color:rgba(255,255,255,.4);font-weight:600">0:00</span>
      </div>
    </div>

    <!-- Controls -->
    <div style="display:flex;align-items:center;justify-content:center;gap:20px">
      <button onclick="auPrev()" style="background:none;border:none;cursor:pointer;color:rgba(255,255,255,.5);transition:.2s;padding:8px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
      </button>
      <button id="au-play-btn" onclick="auTogglePlay()" style="width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#FF8A00,#FFB800);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(255,138,0,.5);transition:.2s">
        <svg id="au-play-icon" width="22" height="22" viewBox="0 0 24 24" fill="#090B12"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </button>
      <button onclick="auNext()" style="background:none;border:none;cursor:pointer;color:rgba(255,255,255,.5);transition:.2s;padding:8px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </button>
    </div>

    <!-- Repeat + Speed + Sleep -->
    <div style="display:flex;justify-content:center;gap:20px;margin-top:16px">
      <button id="au-repeat-btn" onclick="auToggleRepeat()" style="background:none;border:none;cursor:pointer;color:rgba(255,255,255,.35);font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px;font-family:inherit;transition:.2s">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 014-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
        Repeat
      </button>
      <button id="au-speed-btn" onclick="auChangeSpeed()" style="background:rgba(255,255,255,.08);border:none;cursor:pointer;color:rgba(255,255,255,.6);font-size:11px;font-weight:700;padding:5px 12px;border-radius:50px;font-family:inherit;transition:.2s">
        <span id="au-speed-label">1x</span>
      </button>
      <button onclick="auSleepTimer()" style="background:none;border:none;cursor:pointer;color:rgba(255,255,255,.35);font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px;font-family:inherit">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <span id="au-sleep-label">Sleep</span>
      </button>
    </div>
  </div>

  <!-- Stats row -->
  <div style="display:flex;gap:10px;margin-bottom:14px">
    <div style="flex:1;background:var(--card,#fff);border-radius:14px;padding:13px;border:1px solid var(--border,#f0f0f0);text-align:center">
      <div id="au-listened-today" style="font-size:20px;font-weight:700;color:#FF8A00">0</div>
      <div style="font-size:11px;color:var(--text2,#888);margin-top:2px">আজ শোনা</div>
    </div>
    <div style="flex:1;background:var(--card,#fff);border-radius:14px;padding:13px;border:1px solid var(--border,#f0f0f0);text-align:center">
      <div id="au-minutes-today" style="font-size:20px;font-weight:700;color:#FFB800">0</div>
      <div style="font-size:11px;color:var(--text2,#888);margin-top:2px">মিনিট</div>
    </div>
    <div style="flex:1;background:var(--card,#fff);border-radius:14px;padding:13px;border:1px solid var(--border,#f0f0f0);text-align:center">
      <div id="au-fav-count" style="font-size:20px;font-weight:700;color:#ef4444">0</div>
      <div style="font-size:11px;color:var(--text2,#888);margin-top:2px">Favorite</div>
    </div>
  </div>

  <!-- Category Filter -->
  <div style="overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:none;-webkit-overflow-scrolling:touch">
    <div style="display:flex;gap:8px;white-space:nowrap">
      <button class="ac-chip on" onclick="auFilterCat('all',this)">সব</button>
      <button class="ac-chip" onclick="auFilterCat('quran',this)">কুরআন</button>
      <button class="ac-chip" onclick="auFilterCat('nasheed',this)">নাশিদ</button>
      <button class="ac-chip" onclick="auFilterCat('dua',this)">দোয়া</button>
      <button class="ac-chip" onclick="auFilterCat('story',this)">গল্প</button>
      <button class="ac-chip" onclick="auFilterCat('fav',this)">❤️ Favorite</button>
    </div>
  </div>

  <!-- Track count -->
  <div style="font-size:12px;color:var(--text2,#888);font-weight:600;margin-bottom:12px" id="au-count-lbl">২০টি Audio</div>

  <!-- Audio List -->
  <div id="au-list" style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px"></div>

  <!-- Weekly listening chart -->
  <div style="background:var(--card,#fff);border-radius:18px;padding:18px;border:1px solid var(--border,#f0f0f0);margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h3 style="font-size:14px;font-weight:700;color:var(--text,#1a1a2e);margin:0;display:flex;align-items:center;gap:7px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FF8A00" stroke-width="1.5" stroke-linecap="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        এই সপ্তাহ শোনা
      </h3>
      <span id="au-week-total" style="font-size:11px;color:#FF8A00;font-weight:700">0 মিনিট</span>
    </div>
    <div id="au-week-chart" style="display:flex;gap:6px;align-items:flex-end;height:60px"></div>
    <div id="au-week-labels" style="display:flex;gap:6px;margin-top:6px"></div>
  </div>

  <!-- Achievements -->
  <div style="background:var(--card,#fff);border-radius:18px;padding:18px;border:1px solid var(--border,#f0f0f0);margin-bottom:14px">
    <h3 style="font-size:14px;font-weight:700;color:var(--text,#1a1a2e);margin:0 0 14px;display:flex;align-items:center;gap:7px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FF8A00" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
      Achievements
    </h3>
    <div id="au-achievements" style="display:flex;flex-direction:column;gap:10px"></div>
  </div>

</div>
</div>
