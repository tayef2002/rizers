<div id="booknotes-page" class="app-page" style="display:none;overflow-x:hidden">
<style>
/* ===== SMART NOTE — CLEAN UI ===== */
.sn-card {
  background:var(--sn-card-bg, var(--card,#fff));
  border:1px solid var(--sn-card-border, var(--border,#e0e0e0));
  border-radius:12px;
  padding:12px 14px 10px;
  break-inside:avoid;
  margin-bottom:10px;
  position:relative;
  transition:box-shadow .15s, border-color .15s;
  cursor:pointer;
  display:block;
  width:100%;
  box-sizing:border-box;
}
.sn-card:hover {
  box-shadow:0 4px 18px rgba(0,0,0,.09);
  border-color:rgba(139,92,246,.35);
}
.sn-card.pinned::after {
  content:'';
  position:absolute;
  top:0;right:0;
  width:0;height:0;
  border-style:solid;
  border-width:0 16px 16px 0;
  border-color:transparent #8b5cf6 transparent transparent;
  border-radius:0 12px 0 0;
}
.sn-card-title {
  font-size:13px;
  font-weight:700;
  color:var(--text,#1a1a2e);
  margin:0 0 5px;
  line-height:1.35;
}
.sn-card-body {
  font-size:12.5px;
  color:var(--text2,#555);
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
  display:-webkit-box;
  -webkit-line-clamp:7;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.sn-card-tags {
  display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;
}
.sn-tag {
  background:rgba(139,92,246,.09);
  color:#8b5cf6;
  font-size:9.5px;
  font-weight:700;
  padding:2px 7px;
  border-radius:20px;
  letter-spacing:.2px;
}
.sn-card-footer {
  display:flex;align-items:center;justify-content:space-between;
  margin-top:8px;
  padding-top:7px;
  border-top:1px solid var(--border,#f0f0f0);
}
.sn-card-date { font-size:10px;color:var(--text2,#bbb); }
.sn-card-actions { display:flex;gap:2px;opacity:0;transition:opacity .12s; }
.sn-card:hover .sn-card-actions { opacity:1; }
.sn-action-btn {
  background:none;border:none;cursor:pointer;
  padding:4px 5px;border-radius:6px;
  color:var(--text2,#aaa);
  transition:background .12s,color .12s;
  display:flex;align-items:center;
}
.sn-action-btn:hover { background:rgba(139,92,246,.09);color:#8b5cf6; }
.sn-action-btn.del:hover { background:rgba(239,68,68,.09);color:#ef4444; }

.sn-type-badge {
  display:inline-flex;align-items:center;gap:3px;
  font-size:9px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;
  padding:2px 7px;border-radius:20px;margin-bottom:6px;
}

.sn-book-stars { color:#f59e0b;font-size:11px;letter-spacing:.5px; }
.sn-book-progress { height:3px;background:rgba(139,92,246,.1);border-radius:2px;margin-top:5px;overflow:hidden; }
.sn-book-progress-fill { height:100%;background:linear-gradient(90deg,#8b5cf6,#38BDF8);border-radius:2px; }

.sn-check-item { display:flex;align-items:center;gap:6px;margin-bottom:4px; }
.sn-check-item input[type=checkbox] { accent-color:#8b5cf6;width:13px;height:13px;cursor:pointer;flex-shrink:0; }
.sn-check-item label { font-size:12.5px;color:var(--text2,#555);cursor:pointer; }
.sn-check-item input:checked + label { text-decoration:line-through;opacity:.4; }

/* Masonry */
.sn-grid { column-count:2;column-gap:10px; }
@media(min-width:680px){ .sn-grid{column-count:3;} }
@media(max-width:380px){ .sn-grid{column-count:1;} }

/* Quick-add bar — Google Keep style */
.sn-quick-bar {
  display:flex;align-items:center;
  background:var(--card,#fff);
  border:1px solid var(--border,#e0e0e0);
  border-radius:10px;
  padding:11px 14px;
  margin-bottom:12px;
  cursor:text;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
  transition:box-shadow .15s;
}
.sn-quick-bar:hover { box-shadow:0 2px 10px rgba(0,0,0,.10); }
.sn-quick-bar span {
  font-size:14px;
  color:var(--text2,#999);
  flex:1;
  line-height:1;
  user-select:none;
}

/* Inline editor */
.sn-ie-wrap {
  background:var(--card,#fff);
  border:1px solid var(--border,#d8d8d8);
  border-radius:10px;
  box-shadow:0 4px 20px rgba(0,0,0,.13);
  margin-bottom:12px;
  overflow:hidden;
}
.sn-ie-title {
  width:100%;box-sizing:border-box;
  border:none;background:none;outline:none;
  font-size:15px;font-weight:700;
  color:var(--text,#1a1a2e);
  font-family:inherit;
  padding:14px 14px 0;
  display:block;
  line-height:1.4;
}
.sn-ie-title::placeholder { color:var(--text2,#c0c0c0);font-weight:600; }
.sn-ie-body {
  width:100%;box-sizing:border-box;
  border:none;background:none;outline:none;
  font-size:13.5px;
  color:var(--text,#333);
  font-family:inherit;
  resize:none;
  line-height:1.65;
  min-height:70px;
  padding:8px 14px 10px;
  display:block;
}
.sn-ie-body::placeholder { color:var(--text2,#bbb); }
.sn-ie-toolbar {
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 8px 7px;
  border-top:1px solid var(--border,#f0f0f0);
  gap:4px;
}
.sn-ie-tool {
  background:none;border:none;cursor:pointer;
  color:var(--text2,#aaa);
  padding:5px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,color .12s;
  flex-shrink:0;
}
.sn-ie-tool:hover { background:rgba(0,0,0,.07);color:var(--text,#555); }
.sn-ie-tool.active { color:#8b5cf6; }
.sn-ie-dot-sm {
  width:16px;height:16px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;
  transition:transform .12s,border-color .12s;
  flex-shrink:0;
}
.sn-ie-dot-sm:hover,.sn-ie-dot-sm.active { transform:scale(1.25);border-color:rgba(0,0,0,.3); }
.sn-ie-close-btn {
  background:none;border:none;cursor:pointer;
  font-size:13px;font-weight:600;
  color:var(--text2,#777);
  padding:6px 12px;border-radius:6px;
  transition:background .12s;
  white-space:nowrap;
}
.sn-ie-close-btn:hover { background:var(--bg,#f4f4f5); }
.sn-ie-save-btn {
  background:#8b5cf6;border:none;color:#fff;
  font-size:12.5px;font-weight:700;
  padding:6px 16px;border-radius:6px;
  cursor:pointer;
  transition:opacity .15s,background .12s;
  white-space:nowrap;
}
.sn-ie-save-btn:disabled { opacity:.35;cursor:default; }
.sn-ie-save-btn:not(:disabled):hover { background:#7c3aed; }

/* Modal */
.sn-modal-bg {
  display:none;position:fixed;inset:0;z-index:8000;
  background:rgba(0,0,0,.45);backdrop-filter:blur(4px);
  align-items:center;justify-content:center;padding:16px;
}
.sn-modal {
  background:var(--card,#fff);
  border-radius:16px;
  width:100%;max-width:480px;
  padding:20px 20px 24px;
  max-height:90vh;overflow-y:auto;
  box-shadow:0 24px 60px rgba(0,0,0,.25);
}
@media(max-width:460px){
  .sn-modal-bg { align-items:flex-end;padding:0; }
  .sn-modal { border-radius:18px 18px 0 0;padding:18px 16px 32px;max-width:100%; }
}
.sn-input {
  width:100%;box-sizing:border-box;
  background:var(--bg,#f8f9fa);
  border:1px solid var(--border,#e5e7eb);
  border-radius:9px;padding:9px 12px;
  font-size:13px;color:var(--text,#1a1a2e);
  font-family:inherit;outline:none;
  transition:border-color .12s;
  resize:none;
}
.sn-input:focus { border-color:#8b5cf6; }
.sn-input::placeholder { color:var(--text2,#bbb); }
.sn-label { font-size:10px;font-weight:700;color:var(--text2,#999);letter-spacing:.4px;text-transform:uppercase;margin-bottom:4px;display:block; }

.sn-type-tab {
  display:flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;
  border:1px solid var(--border,#e5e7eb);background:none;color:var(--text2,#888);
  transition:.12s;white-space:nowrap;
}
.sn-type-tab.active { background:#8b5cf6;border-color:#8b5cf6;color:#fff; }

/* Color dots */
.sn-color-dot {
  width:18px;height:18px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;transition:transform .12s,border-color .12s;
  flex-shrink:0;
}
.sn-color-dot:hover,.sn-color-dot.active { transform:scale(1.25);border-color:rgba(0,0,0,.25); }

/* FAB */
.sn-fab {
  position:fixed;bottom:76px;right:18px;z-index:7000;
  width:48px;height:48px;border-radius:50%;
  background:linear-gradient(135deg,#8b5cf6,#6366f1);
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 18px rgba(139,92,246,.5);
  transition:transform .15s,box-shadow .15s;
}
.sn-fab:hover { transform:scale(1.07);box-shadow:0 6px 24px rgba(139,92,246,.55); }
.sn-fab:active { transform:scale(.93); }

/* Search */
.sn-search {
  display:flex;align-items:center;gap:6px;
  background:#f1f3f4;
  border:none;
  border-radius:8px;
  padding:10px 14px;
  margin-bottom:10px;
  cursor:text;
}
.sn-search input {
  flex:1;min-width:0;
  font-size:13px;line-height:1.4;
  color:var(--text,#1a1a2e);
  font-family:inherit;
  cursor:text;
  background:transparent !important;
  border:none !important;
  outline:none !important;
  box-shadow:none !important;
  border-radius:0 !important;
  padding:0 !important;
  margin:0 !important;
  -webkit-appearance:none !important;
  appearance:none !important;
}
.sn-search input:focus {
  outline:none !important;
  box-shadow:none !important;
  border:none !important;
  background:transparent !important;
}
.sn-search input:-webkit-autofill,
.sn-search input:-webkit-autofill:hover,
.sn-search input:-webkit-autofill:focus,
.sn-search input:-webkit-autofill:active {
  -webkit-box-shadow:0 0 0 1000px #f1f3f4 inset !important;
  box-shadow:0 0 0 1000px #f1f3f4 inset !important;
  -webkit-text-fill-color:var(--text,#1a1a2e) !important;
  transition:background-color 9999s ease-in-out 0s;
}
.sn-search input::placeholder { color:#aaa; }

.sn-filter-row {
  display:flex;align-items:center;gap:6px;
  overflow-x:auto;padding-bottom:2px;
  margin-bottom:12px;scrollbar-width:none;
}
.sn-filter-row::-webkit-scrollbar { display:none; }
.sn-filter-btn {
  display:flex;align-items:center;gap:4px;
  padding:5px 12px;border-radius:20px;
  font-size:11px;font-weight:700;cursor:pointer;
  border:1px solid var(--border,#e5e7eb);
  background:none;color:var(--text2,#888);
  transition:background .12s,color .12s,border-color .12s;
  white-space:nowrap;flex-shrink:0;line-height:1;
}
.sn-filter-btn.active { background:#8b5cf6;border-color:#8b5cf6;color:#fff; }
.sn-filter-btn svg { flex-shrink:0; }

.sn-empty { text-align:center;padding:48px 20px;color:var(--text2,#ccc); }

/* card color variants */
.sn-c-default { --sn-card-bg:var(--card,#fff); --sn-card-border:var(--border,#e0e0e0); }
.sn-c-purple { --sn-card-bg:rgba(139,92,246,.07); --sn-card-border:rgba(139,92,246,.25); }
.sn-c-blue   { --sn-card-bg:rgba(56,189,248,.07); --sn-card-border:rgba(56,189,248,.25); }
.sn-c-green  { --sn-card-bg:rgba(16,185,129,.07); --sn-card-border:rgba(16,185,129,.25); }
.sn-c-yellow { --sn-card-bg:rgba(245,158,11,.08); --sn-card-border:rgba(245,158,11,.25); }
.sn-c-red    { --sn-card-bg:rgba(239,68,68,.07);  --sn-card-border:rgba(239,68,68,.25); }
.sn-c-pink   { --sn-card-bg:rgba(236,72,153,.07); --sn-card-border:rgba(236,72,153,.25); }

.sn-star-btn { background:none;border:none;font-size:20px;cursor:pointer;color:var(--border,#ccc);transition:color .1s,transform .1s;padding:0 1px; }
.sn-star-btn.lit { color:#f59e0b; }
.sn-star-btn:hover { transform:scale(1.2); }
</style>

        </div>
        <div style="width:1px;height:16px;background:var(--border,#e0e0e0);margin:0 6px;flex-shrink:0"></div>
        <input id="sn-ie-tags" type="text" placeholder="#ট্যাগ" style="border:none;background:none;outline:none;box-shadow:none;font-size:12px;color:var(--text2,#888);font-family:inherit;width:80px;min-width:0;-webkit-appearance:none">
      </div>
      <!-- Right: Close + Save -->
      <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:8px">
        <button class="sn-ie-close-btn" onclick="snCollapseBar()">বন্ধ</button>
        <button id="sn-ie-save-btn" class="sn-ie-save-btn" onclick="snIeSave()" disabled>সংরক্ষণ</button>
      </div>
    </div>
  </div>

  <!-- Search -->
  <!-- fake inputs to trap browser autofill -->
  <input style="display:none" type="text" name="fakeuser">
  <input style="display:none" type="password" name="fakepass">
  <div class="sn-search" onclick="document.getElementById('sn-search-input').focus()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--text2,#aaa)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input id="sn-search-input" type="text" placeholder="নোট খুঁজুন..." oninput="this._userTyped=true;snFilter()" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" readonly onfocus="this.removeAttribute('readonly')">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--text2,#bbb)" stroke-width="2" style="cursor:pointer;flex-shrink:0" onclick="event.stopPropagation();document.getElementById('sn-search-input').value='';snFilter()"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </div>

  <!-- Filters -->
  <div class="sn-filter-row">
    <button class="sn-filter-btn active" onclick="snSetFilter('all',this)">সব</button>
    <button class="sn-filter-btn" onclick="snSetFilter('text',this)"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/></svg> টেক্সট</button>
    <button class="sn-filter-btn" onclick="snSetFilter('checklist',this)"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg> চেকলিস্ট</button>
    <button class="sn-filter-btn" onclick="snSetFilter('book',this)"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> বুক</button>
    <button class="sn-filter-btn" onclick="snSetFilter('idea',this)"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg> আইডিয়া</button>
    <button class="sn-filter-btn" onclick="snSetFilter('pinned',this)"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> পিন</button>
  </div>

  <!-- Grid -->
  <div id="sn-grid" class="sn-grid"></div>
  <div id="sn-empty" class="sn-empty" style="display:none">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="opacity:.2;margin-bottom:10px"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    <div style="font-size:13px;font-weight:600;margin-bottom:3px">কোনো নোট নেই</div>
    <div style="font-size:11px">উপরের বারে ক্লিক করে লিখুন</div>
  </div>

</div>

<!-- FAB -->
<button class="sn-fab" onclick="snOpenModal()" id="sn-fab">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><line x1="12" y1="5" x2="12" y2="19" stroke="white" stroke-width="2.5" stroke-linecap="round"/><line x1="5" y1="12" x2="19" y2="12" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
</button>

<!-- CREATE/EDIT MODAL -->
<div id="sn-modal-bg" class="sn-modal-bg" onclick="snModalBgClick(event)">
  <div class="sn-modal">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div style="font-size:15px;font-weight:800;color:var(--text,#1a1a2e)" id="sn-modal-heading">নতুন নোট</div>
      <button onclick="snCloseModal()" style="background:none;border:none;cursor:pointer;color:var(--text2,#aaa);padding:2px">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Type tabs -->
    <div style="display:flex;gap:5px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none">
      <button class="sn-type-tab active" data-type="text" onclick="snSetType('text',this)" style="display:flex;align-items:center;gap:5px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/></svg> টেক্সট</button>
      <button class="sn-type-tab" data-type="checklist" onclick="snSetType('checklist',this)" style="display:flex;align-items:center;gap:5px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg> চেকলিস্ট</button>
      <button class="sn-type-tab" data-type="book" onclick="snSetType('book',this)" style="display:flex;align-items:center;gap:5px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> বুক নোট</button>
      <button class="sn-type-tab" data-type="idea" onclick="snSetType('idea',this)" style="display:flex;align-items:center;gap:5px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg> আইডিয়া</button>
    </div>

    <!-- Title -->
    <div style="margin-bottom:9px">
      <input id="sn-f-title" type="text" class="sn-input" placeholder="শিরোনাম...">
    </div>

    <!-- Text/Idea -->
    <div id="sn-section-text" style="margin-bottom:9px">
      <textarea id="sn-f-body" class="sn-input" rows="4" placeholder="লিখুন..."></textarea>
    </div>

    <!-- Checklist -->
    <div id="sn-section-checklist" style="display:none;margin-bottom:9px">
      <textarea id="sn-f-checklist" class="sn-input" rows="4" placeholder="প্রথম কাজ&#10;দ্বিতীয় কাজ&#10;তৃতীয় কাজ..."></textarea>
    </div>

    <!-- Book -->
    <div id="sn-section-book" style="display:none">
      <div style="margin-bottom:9px">
        <input id="sn-f-author" type="text" class="sn-input" placeholder="লেখকের নাম...">
      </div>
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:9px">
        <div>
          <div class="sn-label" style="margin-bottom:3px">রেটিং</div>
          <div style="display:flex;gap:2px">
            <button class="sn-star-btn" onclick="snSetStar(1)">★</button>
            <button class="sn-star-btn" onclick="snSetStar(2)">★</button>
            <button class="sn-star-btn" onclick="snSetStar(3)">★</button>
            <button class="sn-star-btn" onclick="snSetStar(4)">★</button>
            <button class="sn-star-btn" onclick="snSetStar(5)">★</button>
          </div>
        </div>
        <div style="flex:1">
          <div class="sn-label">অগ্রগতি <span id="sn-prog-val">0</span>%</div>
          <input id="sn-f-progress" type="range" min="0" max="100" value="0" style="width:100%;accent-color:#8b5cf6;height:3px" oninput="document.getElementById('sn-prog-val').textContent=this.value">
        </div>
      </div>
      <div style="margin-bottom:9px">
        <textarea id="sn-f-takeaways" class="sn-input" rows="3" placeholder="মূল শিক্ষা..."></textarea>
      </div>
      <div style="margin-bottom:9px">
        <textarea id="sn-f-quote" class="sn-input" rows="2" placeholder='প্রিয় উক্তি...'></textarea>
      </div>
    </div>

    <!-- Tags + Color row -->
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
      <input id="sn-f-tags" type="text" class="sn-input" placeholder="#ট্যাগ, #আইডিয়া" style="flex:1">
      <div style="display:flex;gap:5px;align-items:center;flex-shrink:0">
        <div class="sn-color-dot active" data-color="default" onclick="snSetColor('default',this)" style="background:var(--card,#fff);border:1.5px solid var(--border,#ccc)"></div>
        <div class="sn-color-dot" data-color="purple" onclick="snSetColor('purple',this)" style="background:#8b5cf6"></div>
        <div class="sn-color-dot" data-color="blue"   onclick="snSetColor('blue',this)"   style="background:#38BDF8"></div>
        <div class="sn-color-dot" data-color="green"  onclick="snSetColor('green',this)"  style="background:#10b981"></div>
        <div class="sn-color-dot" data-color="yellow" onclick="snSetColor('yellow',this)" style="background:#f59e0b"></div>
        <div class="sn-color-dot" data-color="red"    onclick="snSetColor('red',this)"    style="background:#ef4444"></div>
        <div class="sn-color-dot" data-color="pink"   onclick="snSetColor('pink',this)"   style="background:#ec4899"></div>
      </div>
    </div>

    <!-- Save -->
    <div style="display:flex;gap:8px">
      <button onclick="snSaveNote()" style="flex:1;background:linear-gradient(135deg,#8b5cf6,#6366f1);border:none;color:#fff;padding:11px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer">সংরক্ষণ</button>
      <button onclick="snCloseModal()" style="background:var(--bg,#f4f4f5);border:1px solid var(--border,#e5e7eb);color:var(--text2,#888);padding:11px 16px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer">বাতিল</button>
    </div>
  </div>
</div>

<!-- VIEW MODAL -->
<div id="sn-view-bg" style="display:none;position:fixed;inset:0;z-index:8001;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:16px">
  <div style="background:var(--card,#fff);border-radius:16px;width:100%;max-width:480px;padding:20px 18px 24px;max-height:88vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.25)">
    <div id="sn-view-content"></div>
    <div style="display:flex;gap:7px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border,#f0f0f0)">
      <button id="sn-view-edit-btn" style="flex:1;background:linear-gradient(135deg,#8b5cf6,#6366f1);border:none;color:#fff;padding:10px;border-radius:9px;font-weight:700;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg> এডিট</button>
      <button id="sn-view-pin-btn"  style="background:var(--bg,#f4f4f5);border:1px solid var(--border,#e5e7eb);color:var(--text2,#888);padding:10px 13px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></button>
      <button id="sn-view-del-btn"  style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.18);color:#ef4444;padding:10px 13px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button>
      <button onclick="snCloseView()" style="background:var(--bg,#f4f4f5);border:1px solid var(--border,#e5e7eb);color:var(--text2,#888);padding:10px 13px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
  </div>
</div>

</div>
