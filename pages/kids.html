<div id="kids-page" class="app-page" style="display:none;overflow-x:hidden">
<div style="padding:16px 16px 20px 16px;overflow-x:hidden">

  <!-- Header -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
    <div>
      <h1 style="font-size:20px;font-weight:700;color:var(--text,#1a1a2e);display:flex;align-items:center;gap:8px;margin:0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF8A00" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        Kids Profiles
      </h1>
      <p style="color:var(--text2,#666);font-size:13px;margin-top:4px;margin-bottom:0">প্রতিটা বাচ্চার আলাদা progress দেখুন</p>
    </div>
    <button onclick="window.sbUser&&window._sb?rzOpenAddKidModal():kOpenAddModal()" style="width:40px;height:40px;border-radius:12px;border:none;background:linear-gradient(135deg,#FF8A00,#FFB800);color:#090B12;font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0">+</button>
  </div>

  <!-- Kid tabs -->
  <div id="kid-tabs" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch"></div>

  <!-- Profile section -->
  <div id="kid-profile-wrap" style="display:none">

    <!-- Hero card -->
    <div style="background:linear-gradient(135deg,#1a1a2e,#2d3748);border-radius:22px;padding:22px;margin-bottom:14px;color:#fff">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
        <div id="kp-av" style="width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:28px;font-weight:700;color:#090B12"></div>
        <div style="flex:1;min-width:0">
          <div id="kp-name" style="font-size:20px;font-weight:700;color:#fff"></div>
          <div id="kp-age" style="font-size:12px;color:rgba(255,255,255,.6);margin-top:2px"></div>
          <div id="kp-streak" style="display:inline-flex;align-items:center;gap:4px;margin-top:6px;background:rgba(255,138,0,.2);border-radius:50px;padding:3px 10px;font-size:12px;font-weight:700;color:#FFB800"></div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div id="kp-pts" style="font-size:28px;font-weight:700;color:#FF8A00"></div>
          <div style="font-size:10px;color:rgba(255,255,255,.5)">XP Points</div>
          <div id="kp-level-badge" style="margin-top:4px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:50px;background:rgba(255,138,0,.2);color:#FF8A00"></div>
        </div>
      </div>
      <!-- XP bar -->
      <div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          <span id="kp-level-name" style="font-size:11px;font-weight:700;color:#FF8A00"></span>
          <span id="kp-xp-text" style="font-size:11px;color:rgba(255,255,255,.5)"></span>
        </div>
        <div style="height:6px;background:rgba(255,255,255,.1);border-radius:10px;overflow:hidden">
          <div id="kp-xp-bar" style="height:100%;width:0%;background:linear-gradient(90deg,#FF8A00,#FFB800);border-radius:10px;transition:.4s"></div>
        </div>
      </div>
      <!-- Stats -->
      <div id="kp-stats" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px"></div>
    </div>

    <!-- Daily Log -->
    <div id="kp-log" style="margin-bottom:14px"></div>

    <!-- Weekly Activity heatmap -->
    <div style="background:var(--card,#fff);border-radius:18px;padding:18px;border:1px solid var(--border,#f0f0f0);margin-bottom:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <h3 style="font-size:14px;font-weight:700;color:var(--text,#1a1a2e);margin:0">সপ্তাহের Activity</h3>
        <span id="kp-week-label" style="font-size:12px;color:#FF8A00;font-weight:700"></span>
      </div>
      <div id="kp-heatmap" style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px"></div>
      <div id="kp-heatmap-labels" style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px"></div>
    </div>

    <!-- Subject Progress -->
    <div style="background:var(--card,#fff);border-radius:18px;padding:18px;border:1px solid var(--border,#f0f0f0);margin-bottom:14px">
      <h3 style="font-size:14px;font-weight:700;color:var(--text,#1a1a2e);margin:0 0 14px">এই সপ্তাহের Progress</h3>
      <div id="kp-bars" style="display:flex;flex-direction:column;gap:14px"></div>
    </div>

    <!-- Badges -->
    <div style="background:var(--card,#fff);border-radius:18px;padding:18px;border:1px solid var(--border,#f0f0f0);margin-bottom:14px">
      <h3 style="font-size:14px;font-weight:700;color:var(--text,#1a1a2e);margin:0 0 14px">Badges Collection</h3>
      <div id="kp-badges" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px"></div>
    </div>

    <!-- Today tasks -->
    <div style="background:var(--card,#fff);border-radius:18px;padding:18px;border:1px solid var(--border,#f0f0f0);margin-bottom:14px">
      <h3 style="font-size:14px;font-weight:700;color:var(--text,#1a1a2e);margin:0 0 14px">আজকের Tasks</h3>
      <div id="kp-tasks" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>

    <!-- Quick access -->
    <div style="background:var(--card,#fff);border-radius:18px;padding:18px;border:1px solid var(--border,#f0f0f0);margin-bottom:20px">
      <h3 style="font-size:14px;font-weight:700;color:var(--text,#1a1a2e);margin:0 0 14px">Quick Access</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <button onclick="showPage('islamic')" style="display:flex;align-items:center;gap:8px;padding:12px 14px;background:rgba(255,138,0,.08);color:#FF8A00;border:1.5px solid rgba(255,138,0,.2);border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M8 21V13a4 4 0 018 0v8M4 21V11l8-8 8 8v10"/></svg>
          Islamic
        </button>
        <button onclick="showPage('habits')" style="display:flex;align-items:center;gap:8px;padding:12px 14px;background:rgba(124,58,237,.08);color:#7c3aed;border:1.5px solid rgba(124,58,237,.2);border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          Habits
        </button>
        <button onclick="showPage('quran')" style="display:flex;align-items:center;gap:8px;padding:12px 14px;background:rgba(255,184,0,.08);color:#d97706;border:1.5px solid rgba(255,184,0,.2);border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
          Quran
        </button>
        <button onclick="showPage('study')" style="display:flex;align-items:center;gap:8px;padding:12px 14px;background:rgba(0,0,0,.03);color:var(--text,#1a1a2e);border:1.5px solid var(--border,#e5e7eb);border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Study
        </button>
      </div>
    </div>

  </div>

  <!-- Empty state -->
  <div id="kid-empty" style="display:none;text-align:center;padding:40px 20px">
    <div style="font-size:48px;margin-bottom:12px">👶</div>
    <div style="font-size:16px;font-weight:700;color:var(--text,#1a1a2e);margin-bottom:6px">কোনো profile নেই</div>
    <div style="font-size:13px;color:var(--text2,#888)">উপরে + বাটন চেপে বাচ্চার profile যোগ করুন</div>
  </div>

</div>

<!-- Add Child Modal -->
<div id="kids-add-modal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.65);padding:20px;overflow-y:auto">
  <div style="max-width:420px;margin:0 auto;background:var(--card,#fff);border-radius:22px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)">
    <div style="padding:22px;background:linear-gradient(135deg,#1a1a2e,#2d3748);color:#fff">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:16px;font-weight:700">নতুন বাচ্চা যোগ করুন</div>
        <button onclick="kCloseAddModal()" style="background:rgba(255,255,255,.15);border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;font-family:inherit;line-height:1">✕</button>
      </div>
    </div>
    <div style="padding:22px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
        <div>
          <label style="font-size:12px;font-weight:600;color:var(--text2,#666);display:block;margin-bottom:5px">নাম *</label>
          <input id="kid-new-name" type="text" placeholder="বাচ্চার নাম" style="width:100%;border:1.5px solid var(--border,#e5e7eb);border-radius:10px;padding:9px 12px;font-size:13px;font-family:inherit;outline:none;background:var(--card,#fff);color:var(--text,#1a1a2e);box-sizing:border-box"/>
        </div>
        <div>
          <label style="font-size:12px;font-weight:600;color:var(--text2,#666);display:block;margin-bottom:5px">বয়স</label>
          <input id="kid-new-age" type="number" min="3" max="18" placeholder="বয়স" style="width:100%;border:1.5px solid var(--border,#e5e7eb);border-radius:10px;padding:9px 12px;font-size:13px;font-family:inherit;outline:none;background:var(--card,#fff);color:var(--text,#1a1a2e);box-sizing:border-box"/>
        </div>
      </div>
      <div style="margin-bottom:18px">
        <label style="font-size:12px;font-weight:600;color:var(--text2,#666);display:block;margin-bottom:10px">Avatar বেছে নাও</label>
        <div id="kid-av-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"></div>
      </div>
      <div style="display:flex;gap:8px">
        <button onclick="kAddNew()" style="flex:1;padding:12px;background:linear-gradient(135deg,#FF8A00,#FFB800);color:#090B12;border:none;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">যোগ করুন ✓</button>
        <button onclick="kCloseAddModal()" style="padding:12px 16px;background:var(--border,#f0f0f0);color:var(--text,#444);border:none;border-radius:12px;font-size:13px;cursor:pointer;font-family:inherit">বাতিল</button>
      </div>
    </div>
  </div>
</div>

</div>
